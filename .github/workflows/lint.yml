name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check
        run: |
          status=0
          for f in $(git ls-files '*.php'); do
            php -l "$f" > /dev/null || status=1
          done
          exit $status
      - name: No byte order marks or closing tags
        run: |
          status=0
          for f in $(git ls-files '*.php'); do
            if head -c3 "$f" | grep -q $'\xef\xbb\xbf'; then echo "BOM: $f"; status=1; fi
            if tail -n 3 "$f" | grep -q '^?>'; then echo "Closing tag: $f"; status=1; fi
          done
          exit $status
